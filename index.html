    <link rel="manifest" href="/manifest.json" />
    <title>Burraco Master Club - Segnapunti & Statistiche</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('burraco_theme_v1');
          if (t && ['emerald','navy','burgundy','velvet'].indexOf(t) !== -1) {
            document.documentElement.setAttribute('data-theme', t);
            var m = { emerald: '#08291c', navy: '#091833', burgundy: '#280812', velvet: '#121316' }[t];
            if (m) {
              var meta = document.querySelector('meta[name="theme-color"]');
              if (meta) meta.setAttribute('content', m);
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
