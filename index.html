    <!-- Anti-FOUC Theme Bootstrapping (tutti e 5 i temi inclusa la modalita diurna) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('burraco_theme_v1');
          var themes = {
            emerald: '#08291c',
            navy: '#091833',
            burgundy: '#280812',
            velvet: '#121316',
            daylight: '#f5f1e6'
          };
          if (t && themes[t]) {
            document.documentElement.setAttribute('data-theme', t);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', themes[t]);
          }
        } catch(e) {}
      })();
    </script>
